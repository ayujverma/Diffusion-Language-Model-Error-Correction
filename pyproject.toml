[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-correction"
version = "0.1.0"
description = "Does generation-time confidence improve diffusion self-correction? Controlled loss-weighting study on fixed draft banks."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "safetensors>=0.4",
    "huggingface_hub>=0.30",
    "tokenizers>=0.21",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dlmc = "diffusion_correction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_backbone: requires the pinned Open-dCoder-0.5B weights under runs/hf (skipped otherwise)",
    "tokenizer: requires the pinned tokenizer files under runs/hf (skipped otherwise; no weights needed)",
]
